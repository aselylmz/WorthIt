[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-to-afford"
version = "0.1.0"
description = "Kişiselleştirilmiş finansal hedef tahmin sistemi — belirli bir evi veya arabayı ne zaman satın alabileceğinizi Monte Carlo simülasyonu ile hesaplar."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "WorthIt Team"},
]
keywords = ["finance", "forecasting", "monte-carlo", "simulation", "time-series"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "streamlit>=1.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
